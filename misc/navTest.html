<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="navTest.css">
  <script src="navTest.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

  <title>Collapsible Sidebar</title>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <ul class="menu">
            <li class="menu-item" id="close-button" onclick="toggleSidebar()">
                <i class="fa fa-bars" aria-hidden="true" ></i>
                <span class="menu-text">Website Name</span>
            </li>
            <li class="menu-item">
                <i class="fa-solid fa-home" aria-hidden="true"></i>
                <span class="menu-text">Home</span>
            </li>
            <li class="menu-item">
                <i class="fa-solid fa-user" aria-hidden="true"></i>
                <span class="menu-text">About</span>
            </li>
            <hr class="menu-separator">
            <li class="menu-item">
                <i class="fa fa-cogs" aria-hidden="true"></i>
                <span class="menu-text">Services</span>
            </li>
            <li class="menu-item">
                <i class="fa fa-envelope" aria-hidden="true"></i>
                <span class="menu-text">Contact</span>
            </li>
        </ul>
    </div>

  <div class="content">
    <h1>Welcome!</h1>* {
    outline: 1px solid red; /* Thin red outline around all elements */
}

    <p>Click the menu button to toggle the sidebar.</p>
  </div>
</body>
</html>
