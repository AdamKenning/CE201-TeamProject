<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="../css/settings.css">
</head>
<body>
  <div class="settings-container">

        <div class="avatar"></div>

      </div>

        <div class="icon"></div>

    <main class="settings-main">

      <section class="settings-section">

    <nav id="navbar">
