<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>growth</title>
    <link href="../css/nav.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <nav id="navbar">
        <a id="navbar-food"        class="navbar-others" href="food.html">       <i class="fas fa-utensils"></i></a>
        <a id="navbar-diaper"      class="navbar-others" href="diaper.html">     <i class="fas fa-baby"></i></a>
        <a id="navbar-medication"  class="navbar-others" href="medication.html"> <i class="fas fa-pills"></i></a>
        <a id="navbar-home"        class="navbar-others" href="home.html">       <i class="fas fa-home"></i></a>
        <a id="navbar-growth"      class="navbar-active" href="growth.html">     <i class="fas fa-chart-line"></i></a>
        <a id="navbar-sleep"       class="navbar-others" href="sleep.html">      <i class="fas fa-bed"></i></a>
        <a id="navbar-emotion"     class="navbar-others" href="emotion.html">    <i class="fas fa-face-smile"></i></a>
    </nav>
    

    <!-- Inthese are the places where the user can enter information about the child--> 

    <div class="input-container"> 

        <h2>Child growth<span id="childName"></span></h2> <!--header--> 

        <input type="text" id="ChildNameInput" placeholder="enter child's name"> <!--name--> 

        <input type="number" id="ChildAgeInput" placeholder="age (yr,month)"> <!--age-->

        <input type="number" id="ChildHeightInput" placeholder="height in (cm)">  <!--height--> 

        <input type="number" id="ChildWeightInput" placeholder="weight in (kg)">  <!--weigght--> 

        <input type="number" id="ChildHeadInput" placeholder="head circumference in (cm)"> <!--head size--> 


        <button onclick="saveTheChildInformation()">Save Child Information</button> 

    </div> 

    <!-- this is where the table will go--> 

    <div class="table-container"> 

        <h2>Child Information</h2> 

        <table id="childInformationTble" border="1"> 

            <thead> 

                <tr> 

                    <th>Name</th> <!--the name--> 

                    <th>Age</th>

                    <th>Height (cm)</th> <!--the height--> 

                    <th>Weight (kg)</th> <!--the weiight--> 

                    <th>Head Circumference (cm)</th> <!--the head sizee--> 

                    <th>Date Saved</th> <!-- the data and time --> 

                </tr> 

            </thead> 

            <tbody> 

                <!-- this is where the table will be and where the data will be put.--> 

            </tbody> 

        </table> 

    </div> 

  

    <script> 

        // this is to save the childs information.

        function saveTheChildInformation() { // get the data from the input boxes

            const name = document.getElementById("ChildNameInput").value; //getting the name

            const age = document.getElementById("ChildAgeInput").value; //getting the age

            const height = document.getElementById("ChildHeightInput").value; //getting the height

            const weight = document.getElementById("ChildWeightInput").value; //getting the weight

            const head = document.getElementById("ChildHeadInput").value; //getting the headsize

  

            // to get current date 

            const now = new Date();  
             // to get the correct format of the date
            const formattedDate = now.toLocaleDateString(); //  this is for the live date when the user has clicked the save button

  

            // this is to save the information the the user has entered in.

            const childInformation = { 

                name: name, //save the childname

                age: age, // save the age

                height: height, //save the height

                weight: weight, //save the weight

                head: head, //save the head size

                date: formattedDate //save the date

            }; 

            console.log(childInformation); // this will then save the childs inforamtion


  

            // put the childs information to the table 

            const tableBody = document.getElementById("childInformationTble").getElementsByTagName("tbody")[0]; 

            const newRow = tableBody.insertRow(); // this will make a new row for the information

            newRow.insertCell(0).textContent = childInformation.name; // to makee a new row for name

            newRow.insertCell(1).textContent = childInformation.age; // to makee a new row for age

            newRow.insertCell(2).textContent = childInformation.height; //to make a new row for height

            newRow.insertCell(3).textContent = childInformation.weight; //to make a new row for weight

            newRow.insertCell(4).textContent = childInformation.head; //to mkae a new row for headsize

            newRow.insertCell(5).textContent = childInformation.date; // to add date and time to the table 

        } 

    </script> 


</html> 


</body>
