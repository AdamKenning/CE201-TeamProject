<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>login</title>
    <link href="../css/nav.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <nav id="navbar">
        <a id="navbar-home"class="navbar-others" href="home.html"><i class="fas fa-home"></i></a>
    </nav>

     <!-- Main container for the login/register form -->
  <div class="container">
    <!-- Tabs for switching between Login and Register -->
    <div class="tabs">
      <button id="login-tab" class="active">Login</button>
      <button id="register-tab">Register</button>
    </div>

    <!-- Form container for Login and Register forms -->
    <div class="form-container">
      <!-- Login Form -->
      <form id="login-form" class="active">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" required>
        </div>
        <div class="form-group">
          <button type="submit">Login</button>
        </div>
      </form>

      <!-- Register Form -->
      <form id="register-form">
        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" placeholder="Enter your password" required>
        </div>
        <div class="form-group">
          <label for="register-confirm-password">Confirm Password</label>
          <input type="password" id="register-confirm-password" placeholder="Confirm your password" required>
        </div>
        <div class="form-group">
          <button type="submit">Register</button>
        </div>
      </form>
    </div>
  </div>
</body>
