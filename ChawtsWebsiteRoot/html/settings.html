<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings Screen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="settings-container">
    <header class="header">
      <div class="profile">
        <div class="avatar"></div>
        <div class="user-info">
          <h2>John Doe</h2>
        </div>
      </div>
      <div class="menu-icons">
        <div class="icon"></div>
        <div class="icon"></div>
      </div>
    </header>

    <main class="settings-main">
      <h1>Settings</h1>
      <p>Your Daily Health Statistics</p>
      
      <section class="settings-section">
        <div class="setting-item">
          <span>General</span>
          <span class="icon gear"></span>
        </div>
        <div class="setting-item">
          <span>Children</span>
          <span class="icon smiley"></span>
        </div>
        <div class="setting-item">
          <span>Appearance</span>
          <span class="icon crescent"></span>
        </div>
        <div class="setting-item">
          <span>Password & Security</span>
          <span class="icon key"></span>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-icon home" href="home.html"></div>
      <div class="footer-icon search"></div>
      <div class="footer-icon add"></div>
      <div class="footer-icon profile"></div>
      <div class="footer-icon settings"></div>
    </footer>
  </div>
</body>
</html>
