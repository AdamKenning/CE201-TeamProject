{% extends "base.html" %}
{% load static %}

{% block headerExtra %}
    <link rel="stylesheet" href="{% static 'css/changePW.css' %}" type="text/css">
    <title>Change Password</title>
{% endblock headerExtra %}

{% block bodyExtra %}
    <h2>Change password</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Change" />
    </form>
    <a href="{% url 'dashboard' %}">Back to dashboard</a>
{% endblock bodyExtra %}
