    <style>
        /* to put the data  i have here */
        .chart-container {
            width: 800px;
            height: 400px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        #MygrowthLineGraph {
            width: 75%;
            height: 75%;
        }

          </style>

<body>

    <!--Int hese are the places where the user can enter information about the child--> 
    <div class="childmeasurement-box">
        <div class="input-container">
            <h2>children infor</h2> <!--header ttitle -->
            <div class="input-grid">
                <input type="text" id="childrenNameinputs" placeholder="enter child name"> <!--name -->
                <input type="number" id="childageInputs" placeholder="age ( in months)"> <!-- age -->
                <input type="number" id="theChildsHeight" placeholder="height (cm)"> <!-- height-->
                <input type="number" id="theChildsWeight" placeholder="weight (kg)"> <!-- height -->
                <input type="number" id="theChildsHeadSize" placeholder="head size (cm)"> <!-- their head size -->
                <select id="SelectChildGender"> <!-- choose the geneer -->
                    <option value="">select the childs gender</option>
                    <option value="male">male</option>
                    <option value="female">female</option>
                </select>
            </div>
            <button onclick="saveChildInfo()" class="save-btn">save the child information</button> <!--save the information-->
        </div>

        <div class="chart-container">
            <div class="chart-header">
                <select id="childSelector" onchange="updateChart()">
                    <option value="">select the child</option>
                </select>
                <div class="chart-tabs">
                    <button class="chart-tab active" data-type="height" onclick="switchChart('height')">hheight</button>
                    <button class="chart-tab" data-type="weight" onclick="switchChart('weight')">weigght</button>
                    <button class="chart-tab" data-type="head" onclick="switchChart('head')">head circumference</button>
                </div>
            </div>
            <canvas id="MygrowthLineGraph"></canvas>
        </div>

        <div class="table-container"> <!-- where all the information you put about the child will go -->
            <h2>all of the measurements</h2>
            <table id="childInfoTable">   <!-- the table of the information -->
                <thead>
                    <tr>
                        <th>name</th>
                        <th>age ( in months)</th>
                        <th>height (cm)</th>
                        <th>weight (kg)</th>
                        <th>head (cm)</th>
                        <th>date saved</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- data will be put here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let MygrowthLineGraph;
        let theChildsData = {};

        function saveChildInfo() {
            const name = document.getElementById('childrenNameinputs').value.trim();
            const age = document.getElementById('childageInputs').value;
            const height = document.getElementById('theChildsHeight').value;
            const weight = document.getElementById('theChildsWeight').value;
            const head = document.getElementById('theChildsHeadSize').value;
            const gender = document.getElementById('SelectChildGender').value;

            if (!name) {
                alert('enter an actualy name please'); // if the user doesnt enter a name
                return;
            }

            const now = new Date();
            const formattedDateTime = now.toLocaleString();

            // to add the childs name it will save it
            if (!theChildsData[name]) {
                theChildsData[name] = [];
                // make a list thing
                const selector = document.getElementById('childSelector'); // then adds it to the child selector
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                selector.appendChild(option);
            }

            theChildsData[name].push({
                age: parseInt(age),
                height: parseFloat(height),
                weight: parseFloat(weight),
                head: parseFloat(head),
                gender: gender,
                dateTime: formattedDateTime
            });

            // add the information to the table
            const tableBody = document.getElementById('childInfoTable').getElementsByTagName('tbody')[0];
            const newRow = tableBody.insertRow();
            
            const cells = [name, age, height, weight, head, formattedDateTime];
            cells.forEach(cell => {
                const newCell = newRow.insertCell();
                newCell.textContent = cell;
            });

            newRow.addEventListener("click", () => generatePDF({
                name, age, height, weight, head, gender, dateTime: formattedDateTime
            }));

            clearInputs();
            updateChart();
        }

        function updateChart() {
            // get the childs name that was chosen
            const selectedChild = document.getElementById('childSelector').value;
            if (!selectedChild) return;

            // retrive their data
            const childData = theChildsData[selectedChild];
            
            // Gsee whether it is weight height etc
            const activeTab = document.querySelector('.chart-tab.active');
            const chartType = activeTab.getAttribute('data-type');

            // clear the chart so it does not become messy
            if (MygrowthLineGraph) {
                MygrowthLineGraph.destroy();
            }

            // char.js stuff to draw the chart
            const canvas = document.getElementById('MygrowthLineGraph');
            const ctx = canvas.getContext('2d');

            // getting the data
            const ages = childData.map(entry => entry.age);
            const measurements = childData.map(entry => entry[chartType]);

            
            let measurementUnit = 'cm';
            if (chartType === 'weight') {
                measurementUnit = 'kg';
            }

            // this is to make the new chart
            MygrowthLineGraph = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ages,
                    datasets: [{
                        label: chartType + ' over time',
                        data: measurements,
                        borderColor: 'rgb(75, 192, 192)',
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            title: {
                                display: true,
                                text: chartType + ' (' + measurementUnit + ')'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Age (months)'
                            }
                        }
                    }
                }
            });
        }

        function switchChart(type) {
            // remove the prevous tabs
            const allTabs = document.querySelectorAll('.chart-tab');
            for (let tab of allTabs) {
                tab.classList.remove('active');
            }
            
            
            const clickedTab = event.target;
            clickedTab.classList.add('active');
            
            // updating the chart
            updateChart();
        }

        function clearInputs() { // this will remove the inputs in the graph
            document.getElementById('childrenNameinputs').value = ''; // remove the selected child
            document.getElementById('childageInputs').value = ''; // remobe age
            document.getElementById('theChildsHeight').value = ''; // remove height
            document.getElementById('theChildsWeight').value = ''; // remove weight
            document.getElementById('theChildsHeadSize').value = ''; // remove head size
            document.getElementById('SelectChildGender').value = ''; // remove child gender

            // to get the line chart, this is just a front end basic to show how it would look like
        // to get a place to put the line graph
        }

    </script>
</body>
