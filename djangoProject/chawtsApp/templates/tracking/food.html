{% extends "base-sidebar.html" %}
{% load static %}

{% block headExtra %}
    <link rel="stylesheet" href="{% static 'css/food.css' %}" type="text/css">
    <title>Food</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock headExtra %}

{% block bodyExtra %}
    <header>
        <h1>Food Traker</h1>
    </header>

    <form id="food-form">
        <h2>Meal Entry</h2>
        <label for="meal-time">Meal Time:</label>
        <input type="datetime-local" id="meal-time">
        
        <label for="feeding-type">Feeding Type:</label>
        <select id="feeding-type" onchange="toggleFoodInput()">
            <option value="formula">Formula</option>
            <option value="cow-milk">Cow Milk</option>
            <option value="breast-milk">Breast Milk</option>
            <option value="solids">Solids</option>
        </select>
    </form>

    <script>
        function toggleFoodInput() {
            let type = document.getElementById('feeding-type').value;
            console.log("Selected Feeding Type: ", type);
        }
    </script>

    
{%endblock bodyExtra %}
