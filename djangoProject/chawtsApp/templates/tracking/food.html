{% extends "base-sidebar.html" %}
{% load static %}

{% block headExtra %}
    <link rel="stylesheet" href="{% static 'css/food.css' %}" type="text/css">
    <title>Food</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock headExtra %}

{% block bodyExtra %}
    <header>
        <h1>Food Traker</h1>
    </header>

    <form id="food-form">
        <h2>Meal Entry</h2>
        <label for="meal-time">Meal Time:</label>
        <input type="datetime-local" id="meal-time" lang="en" required>
        
        <label for="feeding-type">Feeding Type:</label>
        <select id="feeding-type" onchange="toggleFoodInput()">
            <option value="formula">Formula</option>
            <option value="cow-milk">Cow Milk</option>
            <option value="breast-milk">Breast Milk</option>
            <option value="solids">Solids</option>
        </select>

        <div id="liquid-input" style="display: none;">
            <label for="liquid-amount">Amount (ml):</label>
            <input type="number" id="liquid-amount" min="0" placeholder="Enter amount in ml">
        </div>

        <div id="solid-input" style="display: none;">
            <label for="solid-food">Food Name:</label>
            <input type="text" id="solid-food" placeholder="Enter food name">
            
            <label for="solid-portion">Portion Size:</label>
            <select id="solid-portion">
                <option value="0">None</option>
                <option value="0.25">Some</option>
                <option value="0.5">Half</option>
                <option value="0.75">Most</option>
                <option value="1">All</option>
            </select>
        </div>
    </form>

    <script>
        document.getElementById("meal-time").addEventListener("focus", function() {
            this.type = "datetime-local";
            this.lang = "en";
        });

        function toggleFoodInput() {
            let type = document.getElementById('feeding-type').value;
            let liquidInput = document.getElementById('liquid-input');
            let solidInput = document.getElementById('solid-input');

            if (type === "solids") {
                liquidInput.style.display = "none";
                solidInput.style.display = "block";
            } else {
                liquidInput.style.display = "block";
                solidInput.style.display = "none";
            }
        }
    </script>

    
{%endblock bodyExtra %}
