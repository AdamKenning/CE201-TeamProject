{% extends "base.html" %}
{% load static %}

{% block headExtra %}
    <link rel="stylesheet" href="{% static 'css/shared.css' %}" type="text/css">
    <title>Create Child</title>
{% endblock headExtra %}

{% block bodyExtra %}
    <main>
        <img class="pageLogo" src="{% static 'icons/LogoHeavy.svg' %}" alt="logo"/>
        <h2>Create a New Child</h2>
        <form class="form" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <input class="button" type="submit" value="Create"/>
            <input type="hidden" name="next" value="{% url 'dashboard' %}" />
            {% comment %} <input class="button" type="submit" value="Login" placeholder="Username"/> {% endcomment %}

        </form>
        <a class="button" href="{% url 'dashboard' %}">Dashboard</a>
    </main>
{% endblock bodyExtra %}
