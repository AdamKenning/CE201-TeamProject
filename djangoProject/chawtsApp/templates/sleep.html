{% extends "base.html" %}
{% load static %}

{% block headerExtra %}
    <link rel="stylesheet" href="{% static 'css/sleep.css' %}" type="text/css">
    <title>sleep</title>
{% endblock headerExtra %}

{% block bodyExtra %}
    <div class="container">
        {% comment %} Left Sidebar {% endcomment %}
        <div class="settings"></div>
        <div class="info-box-1"></div>
        <div class="info-box-2"></div>

        {% comment %} Main Content {% endcomment %}
        <div class="main">
            <div class="arrow arrow-left">&#8592;</div>
            <div class="graph-space"></div>
            <div class="arrow arrow-right">&#8594;</div>
            <div class="search-buttons">
                <div class="search-button"></div>
                <div class="search-button"></div>
                <div class="search-button"></div>
                <div class="search-button"></div>
            </div>
        </div>

        {% comment %} Right Sidebar {% endcomment %}
        <div class="upload">
            <label for="sleep-hours" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: inherit; font-size: 1rem; cursor: pointer;">
                Enter Hours Slept
            </label>
            <input type="number" id="sleep-hours" placeholder="Hours" min="0" max="24" style="width: 90%; height: 50%; border: 2px solid #ccc; border-radius: 5px; text-align: center; font-size: 1.2rem; outline: none; margin-top: 10px;">
        </div>
        <div class="info-box-3">></div>
    </div>
{%endblock bodyExtra %}
