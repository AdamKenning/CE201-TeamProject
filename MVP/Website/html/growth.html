    <!-- Int hese are the places where the user can enter information about the child--> 

    <div class="childmeasurement-box"> 

        <h2>Child growth<span id="childName"></span></h2> <!--theheader--> 

        <input type="text" id="ChildNameInput" placeholder="enter child's name"> <!--name--> 

        <input type="number" id="ChildAgeInput" placeholder="age (yr,month)"> <!--for the age-->

        <input type="number" id="ChildHeightInput" placeholder="height in (cm)">  <!--height--> 

        <input type="number" id="ChildWeightInput" placeholder="weight in (kg)">  <!--weigght--> 

        <input type="number" id="ChildHeadInput" placeholder="head circumference in (cm)"> <!--for the head size--> 


        <button onclick="saveTheChildInformation()">Save Child Information</button> <!-- is the button to save the child informations--> 

    </div> 

    <!--  is where the table will go--> 

    <div class="detail-table">  

        <h2>Child Information</h2>  

        <table id="childInformationTble" border="1">  <!-- the tablle and to get a border around it--> 

            <thead> 

                <tr> 

                    <th>Name</th> <!--the name--> 

                    <th>Age</th>  <!--the age--> 

                    <th>Height (cm)</th> <!--the height--> 

                    <th>Weight (kg)</th> <!--the weiight--> 

                    <th>Head Circumference (cm)</th> <!--the head sizee--> 

                    <th>Date Saved</th> <!-- will show when it wassaved--> 

                </tr> 

            </thead> 

            <tbody> 

                <!--  where the data will be put.--> 

            </tbody> 

        </table> 

    </div> 
    <!-- the box  for the chart to be put inn -->
    <div class="childline-chart">
        <h2>child growth summary height (placeholder/frontnend)</h2>
        <canvas id="growthSummary"></canvas>
    </div>

  

    <script> 

        // this is to save the childs information.

        function saveTheChildInformation() { // get the data from the input boxes

            const Childsname = document.getElementById("ChildNameInput").value; //getting the name

            const Childsage = document.getElementById("ChildAgeInput").value; //getting the age

            const Childsheight = document.getElementById("ChildHeightInput").value; //getting the height

            const Childsweight = document.getElementById("ChildWeightInput").value;  //  the weight

            const Childshead = document.getElementById("ChildHeadInput").value; // a headsize


            const now = new Date();  
             // to get the correct format of the date
            const formattedDate = now.toLocaleDateString(); //  to get the live date when save button is clicked

  

            // this is to save the information the the user has entered in.

            const childInformation = { 

                name: Childsname, //save the childname

                age: Childsage, // save the age

                height: Childsheight, //save the height

                weight: Childsweight, 

                head: Childshead, //headsize

                date: formattedDate, //tosave the date

            }; 

            console.log(childInformation); // this will then save the childs inforamtion


  

            // put the childs information to the table 

            const tableBody = document.getElementById("childInformationTble").getElementsByTagName("tbody")[0]; 

            const newRow = tableBody.insertRow(); // this will make a new row for the information

            newRow.insertCell(0).textContent = childInformation.name; // to makee a new row for name

            newRow.insertCell(1).textContent = childInformation.age; // to makee a new row for age

            newRow.insertCell(2).textContent = childInformation.height; //to make a new row for height

            newRow.insertCell(3).textContent = childInformation.weight; //to makke a new row for weightt

            newRow.insertCell(4).textContent = childInformation.head;  // mke nfor headsize

            newRow.insertCell(5).textContent = childInformation.date;  // row for date

        } 
        
        // to get the line chart, this is just a front end basic to show how it would look like
        // to get a place to put the line graph
        const ctx = document.getElementById("growthSummary").getContext("2d");
        const growthSummary = new Chart(ctx, { // to make the chart
            
            options: { // telling what it should look like
                scales: {
                    x: {
                        title: {
                            display: true, // to show the name
                            text: "child age" //show on the x axis
                        }
                    },
                    y: {
                        title: { 
                            display: true,
                            text: "height (cm)" //show on the y axis
                        }
                    }
                }
            }
        });
    </script> 


</html>
